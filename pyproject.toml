[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-routing-agent"
version = "2.0.0"
description = "Multi-agent Customer Support Routing Agent built with LangGraph and Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "google-genai>=0.1.1",
    "langchain-core>=0.2.0",
    "langgraph>=0.0.30",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
